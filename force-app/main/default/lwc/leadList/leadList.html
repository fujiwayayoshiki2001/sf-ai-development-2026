<template>
    <lightning-card title="リード一覧" icon-name="standard:lead">
        <span slot="actions" class="slds-text-body_small slds-text-color_weak">
            {recordCount} 件
        </span>

        <div class="slds-var-p-horizontal_medium">
            <!-- フィルタ + 検索 -->
            <div class="slds-grid slds-gutters slds-grid_vertical-align-end slds-wrap slds-var-m-bottom_small">
                <div class="slds-col slds-size_1-of-3">
                    <lightning-combobox
                        label="カテゴリ"
                        value={selectedCategory}
                        options={categoryOptions}
                        onchange={handleCategoryChange}
                        variant="label-stacked">
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_2-of-3">
                    <lightning-input
                        type="search"
                        label="名前・会社名で検索"
                        value={searchKey}
                        onchange={handleSearchInput}
                        placeholder="検索キーワードを入力"
                        variant="label-stacked">
                    </lightning-input>
                </div>
            </div>

            <!-- 検索モード表示 -->
            <template lwc:if={isSearchMode}>
                <div class="slds-var-m-bottom_x-small">
                    <lightning-badge label="検索結果"></lightning-badge>
                    <lightning-button-icon
                        icon-name="utility:close"
                        variant="bare"
                        alternative-text="検索をクリア"
                        title="検索をクリア"
                        onclick={handleClearSearch}>
                    </lightning-button-icon>
                </div>
            </template>
        </div>

        <!-- 本体 -->
        <div class="slds-is-relative slds-var-p-horizontal_medium slds-var-p-bottom_medium">
            <template lwc:if={isLoading}>
                <lightning-spinner alternative-text="読み込み中" size="small"></lightning-spinner>
            </template>

            <template lwc:if={hasLeads}>
                <lightning-datatable
                    key-field="Id"
                    data={displayLeads}
                    columns={columns}
                    hide-checkbox-column
                    onrowaction={handleRowAction}
                    onsort={handleSort}
                    sorted-by={sortedBy}
                    sorted-direction={sortedDirection}>
                </lightning-datatable>
            </template>

            <!-- Empty State -->
            <template lwc:else>
                <template lwc:if={isLoading}></template>
                <template lwc:else>
                    <div class="slds-illustration slds-illustration_small slds-var-p-around_medium slds-text-align_center">
                        <lightning-icon icon-name="utility:search" size="small"
                            class="slds-var-m-bottom_x-small"></lightning-icon>
                        <p class="slds-text-body_regular slds-text-color_weak">
                            該当するリードがありません。
                        </p>
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
